version: '3'
services:
  app:
    build: .
    command: npm start
    ports:
      - "3000:3000"
    volumes:
      - ./license.json:/app/license.json
      - ./logs:/app/logs
    restart: always
    depends_on:
      - mongo
      - redis
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tv_timer_prod?authSource=admin
      - REDIS_URL=redis://redis:6379
  worker:
    build: .
    command: npm run worker
    restart: always
    volumes:
      - ./license.json:/app/license.json
      - ./logs:/app/logs
    depends_on:
      - mongo
      - redis
    environment:
      - MONGODB_URI=mongodb://mongo:27017/tv_timer_prod?authSource=admin
      - REDIS_URL=redis://redis:6379
  mongo:
    image: mongo:6
    volumes:
      - mongo-data:/data/db
    restart: always
  redis:
    image: redis:6
    volumes:
      - redis-data:/data
    restart: always
volumes:
  mongo-data:
  redis-data:
